<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Complete Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: snow;
        }
        form {
            width: 500px;
            margin: 0 auto;
        }
        fieldset {
            border: 2px solid teal;
            margin-bottom: 15px;
            padding: 15px;
            background-color: white;
        }
        legend {
            font-weight: bold;
            color: teal;
            padding: 0 5px;
        }
        div {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 3px;
        }
        input, select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
        .inline-group {
            display: flex;
            gap: 10px;
        }
        .inline-group label {
            display: inline;
        }
        .inline-group input {
            width: auto;
        }
        button {
            background-color: teal;
            color: white;
            padding: 10px 20px;
            border: none;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: teal;">Complete Admission Form</h2>

    <form action="#" method="post" enctype="multipart/form-data">
        
        <fieldset>
            <legend>Personal Information</legend>
            <div>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div>
                <label>Gender:</label>
                <div class="inline-group">
                    <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>
            <div>
                <label for="degree">Applying For Program:</label>
                <select id="degree" name="degree">
                    <option value="bscs">BS Computer Science</option>
                    <option value="bsse">BS Software Engineering</option>
                    <option value="bba">BBA</option>
                </select>
            </div>
            <div>
                <label for="marks">Previous Marks (%):</label>
                <input type="number" id="marks" name="marks" min="0" max="100">
            </div>
        </fieldset>

        <fieldset>
            <legend>Contact Information</legend>
            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div>
                <label for="address">Postal Address:</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>Document Upload</legend>
            <div>
                <label for="photo">Upload Passport Size Photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>
            <div>
                <label for="transcripts">Upload Transcripts/Certificates:</label>
                <input type="file" id="transcripts" name="transcripts" accept=".pdf" multiple>
            </div>
        </fieldset>

        <fieldset>
            <legend>Declaration</legend>
            <div class="inline-group">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">I hereby declare that all the information provided above is true and correct.</label>
            </div>
        </fieldset>

        <button type="submit">Submit Admission Form</button>

    </form>

</body>
</html>
