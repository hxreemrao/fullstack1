<!DOCTYPE html>
<html>
<body>
    <h1>Profile Image</h1>
    <img id="profileImage" src="https://placehold.co/180x140?text=Original" alt="Original image" width="180">
    <p id="altText">Alt text: Original image</p>
    <button id="imageButton">Change Image Attributes</button>

    <script>
        const image = document.getElementById("profileImage");
        const altText = document.getElementById("altText");

        document.getElementById("imageButton").addEventListener("click", function () {
            image.setAttribute("src", "https://placehold.co/180x140/1f5f99/ffffff?text=Updated");
            image.setAttribute("alt", "Updated placeholder image");
            altText.textContent = "Alt text: " + image.getAttribute("alt");
        });
    </script>
</body>
</html>
