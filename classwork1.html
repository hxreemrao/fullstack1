<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <table border="1">
        <th>Column 1</th>
        <th>Column 2</th>
        <tr id="row1">
            <td>Row 1, Cell 1</td>
            <td>Row 1, Cell 2</td>
        </tr>
        <tr id="row2">
            <td>Row 2, Cell 1</td>  
            <td>Row 2, Cell 2</td>
        </tr>
        <tr rowspan="2" id="row3">
            <td>Row 3, Cell 1</td>
            <td>Row 3, Cell 2</td>
        </tr>
    </table>
    <br>
    <form action=""">
        <label for="">NAME</label><br>
    <input type="text" name="name" id="name" placeholder="Enter your name"><br>
    <label for="">EMAIL</label><br>
    <input type="email" name="email" id="email" placeholder="Enter your email"><br>
    <label for="">Password</label><br>
    <input type="password" name="password" id="password" placeholder="Enter your password"><br>
    <label for="">Checkbox</label><br>
    <input type="checkbox" name="checkbox" id="checkbox" placeholder="Enter your name"><br>
    <label for="">Radio</label><br>
    <input type="radio" name="gender" id="male" placeholder="Male"><label for="male">Male</label>
    <input type="radio" name="gender" id="female" placeholder="Female"><label for="female">Female</label><br>
    <label for="">Date</label><br>
    <input type="date" name="date" id="date" placeholder="Enter your date"><br>
    <input type="submit" value="Submit">
    
    </form>
</body>
</html>
